[package]
name = "swayshare"
version = "0.1.0"
edition = "2024"
description = "Temporary, peer-scoped remote desktop access for Sway"
license = "MIT"
repository = "https://github.com/enigmacurry/swayshare"
readme = "README.md"

[features]
# The GTK4 configuration window. On by default; `--no-default-features` gives
# a CLI-and-tray-only build that does not need GTK development libraries.
default = ["gui"]
gui = ["dep:gtk4", "dep:async-channel"]

[dependencies]
anyhow = "1.0.104"
async-channel = { version = "2.5.0", optional = true }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
getrandom = "0.4.3"
# v4_8 for gdk::FileList::from_array, which is how a file is handed to another
# application: GTK's serialisers for it include the document-portal path, so a
# sandboxed chat client can read what it is dropped. GTK 4.8 is from 2022.
gtk4 = { version = "0.11.5", optional = true, features = ["v4_8"] }
if-addrs = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
ksni = "0.3.7"
notify-rust = "4.19.0"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }
toml = "1.2.1"
# Reads back the addresses our own certificate already names, so the decision
# to reissue comes from the certificate itself rather than a file beside it
# that can drift. Already in the tree: rcgen depends on it unconditionally.
x509-parser = "0.18.1"
zeroize = "1.9.1"

[package]
name = "swayshare"
version = "0.1.0"
edition = "2024"
description = "Temporary, peer-scoped remote desktop access for Sway"
license = "MIT"
repository = "https://github.com/enigmacurry/swayshare"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
notify-rust = "4.19.0"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }
toml = "1.2.1"
zeroize = "1.9.1"
